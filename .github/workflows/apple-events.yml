name: Apple Developer Events Monitor

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright browser and dependencies
        run: |
          python -m pip install playwright requests
          PLAYWRIGHT_BROWSERS_PATH=0 python -m playwright install chromium

      - name: Run Apple events scraper
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PLAYWRIGHT_BROWSERS_PATH=0 python scripts/fetch_events.py

      - name: Commit updated event snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json calendar/apple-developer-events.ics
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Apple developer events"
            git push
          fi
